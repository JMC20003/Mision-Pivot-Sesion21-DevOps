name: cicd pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and verify
        run: mvn -B -ntp verify

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: cambioexpress-jar
          path: target/cambioexpress-*.jar
          if-no-files-found: error

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: cambioexpress-jar
          path: dist

      - name: Deploy to dev
        run: bash devops/desplegar.sh dev dist/cambioexpress-*.jar
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  deploy-cert:
    needs: deploy-dev
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: cert
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: cambioexpress-jar
          path: dist

      - name: Deploy to cert
        run: bash devops/desplegar.sh cert dist/cambioexpress-*.jar
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
